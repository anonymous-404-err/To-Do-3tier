name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Build & Check Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: |
          cd backend
          npm install
      - run: docker build -t backend-test ./backend

  test-frontend:
    name: Build & Check Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: |
          cd frontend
          npm install
      - run: |
          cd frontend
          npm run build
      - run: docker build --build-arg VITE_API_URL=https://placeholder.onrender.com/api/todos -t frontend-test ./frontend

  deploy:
    name: Deploy to Render
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Backend Deployment
        run: curl -s -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
      - name: Trigger Frontend Deployment
        run: curl -s -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
