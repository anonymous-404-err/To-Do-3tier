name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Test & Lint Backend
  # ---------------------------------------------------------------------------
  test-backend:
    name: Build & Check Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Validate Backend Dockerfile
        run: |
          docker build -t backend-test ./backend

  # ---------------------------------------------------------------------------
  # JOB 2: Test & Build Frontend
  # ---------------------------------------------------------------------------
  test-frontend:
    name: Build & Check Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React App (Vite)
        run: |
          cd frontend
          npm run build

      - name: Validate Frontend Dockerfile
        run: |
          docker build --build-arg VITE_API_URL=https://placeholder.onrender.com/api/todos -t frontend-test ./frontend

  # ---------------------------------------------------------------------------
  # JOB 3: Deploy to Render (Only on push to main)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Render
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Backend Deployment
        run: |
          echo "Triggering Render Backend Build..."
          curl -s -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Trigger Frontend Deployment
        run: |
          echo "Triggering Render Frontend Build..."
          curl -s -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
